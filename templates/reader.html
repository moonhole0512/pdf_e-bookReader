
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ file.book.title }} - Vol.{{ file.volume_number }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body data-file-id="{{ file.id }}" data-pdf-url="{{ pdf_url }}" data-initial-page="{{ state.current_page }}">

    <div id="reader-container">
        <div id="loader-overlay">
            <div class="loader"></div>
            <p>로딩 중...</p>
        </div>
        <div id="pdf-viewer"></div>

        <!-- Click & Tap Navigation Zones (Left 25%, Center 50%, Right 25%) -->
        <div id="reader-touch-zones">
            <div id="zone-prev" class="touch-zone touch-zone-left" title="이전 페이지 (클릭 또는 탭)">
                <div class="zone-hint">‹</div>
            </div>
            <div id="zone-center" class="touch-zone touch-zone-center" title="메뉴 토글 (클릭 또는 탭)"></div>
            <div id="zone-next" class="touch-zone touch-zone-right" title="다음 페이지 (클릭 또는 탭)">
                <div class="zone-hint">›</div>
            </div>
        </div>
    </div>

    <!-- Bottom Timeline Scrubber -->
    <div id="reader-scrubber-container">
        <div id="scrubber-track">
            <div id="scrubber-progress"></div>
            <div id="scrubber-thumb"></div>
        </div>
        <div id="scrubber-tooltip" class="hidden">p. 1</div>
    </div>

    <div id="page-indicator">
        <span id="page-num"></span> / <span id="page-count"></span>
    </div>

    <!-- TOC / Bookmarks Sidebar Drawer -->
    <div id="toc-sidebar" class="sidebar-drawer hidden">
        <div class="sidebar-header">
            <h3>📖 목차</h3>
            <button id="close-toc-btn" class="close-x-btn">&times;</button>
        </div>
        <div class="sidebar-body">
            <div id="toc-empty-msg" class="hidden">이 책에는 등록된 목차가 없습니다.</div>
            <ul id="toc-list"></ul>
        </div>
    </div>
    <div id="toc-backdrop" class="modal-backdrop hidden"></div>

    <!-- Floating Action Buttons (Bottom-Right) -->
    <div id="floating-controls">
        <!-- The toggle button for mobile -->
        <button id="fab-toggle-btn" class="fab">
            <div class="icon-ellipsis">
                <div></div>
                <div></div>
                <div></div>
            </div>
        </button>

        <!-- The functional buttons -->
        <button id="toc-toggle-btn" class="fab" title="목차 열기 (단축키: M)">
            <span style="font-size: 16px;">📑</span>
        </button>
        <button id="fullscreen-toggle-btn" class="fab" title="전체화면 전환 (단축키: F)">
            <span id="fullscreen-icon" style="font-size: 15px;">⛶</span>
        </button>
        <button id="settings-btn" class="fab" title="설정 (단축키: S)">
            <div class="icon-gear"></div>
        </button>
        <button id="zoom-in" class="fab" title="확대">+</button>
        <button id="zoom-out" class="fab" title="축소">-</button>
        <a href="{{ url_for('library.index') }}" id="list-btn" class="fab" title="서재로 돌아가기 (단축키: Esc)">
            <div class="icon-list">
                <div></div>
                <div></div>
                <div></div>
            </div>
        </a>
    </div>

    <!-- Settings Panel (Now an Overlay) -->
    <div id="settings-panel" class="hidden">
        <div class="settings-header">
            <h2>설정</h2>
        </div>
        <div class="settings-panel-content">
            <div class="settings-section">
                <h4>표시</h4>
                <div class="setting-item">
                    <label for="toggle-page-indicator">페이지 표시</label>
                    <input type="checkbox" id="toggle-page-indicator" checked>
                </div>
            </div>
            <div class="settings-section">
                <h4>화면 맞춤</h4>
                <div class="button-group">
                    <button id="fit-to-width">너비</button>
                    <button id="fit-to-height">높이</button>
                </div>
            </div>
            <div class="settings-section">
                <h4>페이지 레이아웃</h4>
                <div class="button-group">
                    <button id="view-one-page">1P</button>
                    <button id="view-two-page-ltr">2P (좌->우)</button>
                    <button id="view-two-page-rtl">2P (우->좌)</button>
                </div>
            </div>
            <div id="color-settings-section" class="settings-section">
                <div class="section-title-wrapper">
                    <h4>색상</h4>
                    <button id="reset-color-settings">초기화</button>
                </div>
                <div class="setting-item">
                    <label for="brightness-slider">밝기</label>
                    <input type="range" id="brightness-slider" min="50" max="200" value="100">
                </div>
                <div class="setting-item">
                    <label for="contrast-slider">대비</label>
                    <input type="range" id="contrast-slider" min="50" max="200" value="100">
                </div>
                <div class="setting-item">
                    <label for="saturation-slider">채도</label>
                    <input type="range" id="saturation-slider" min="0" max="200" value="100">
                </div>
                <div class="setting-item">
                    <label for="invert-colors-toggle">색상 반전</label>
                    <input type="checkbox" id="invert-colors-toggle">
                </div>
            </div>
        </div>
    </div>

    <div id="next-volume-popup" class="modal-overlay hidden">
        <div class="modal-content completion-sheet-content">
            <div class="completion-celebration">
                <div class="completion-trophy">🎉</div>
                <h2>완독을 축하합니다!</h2>
                <p class="completion-book-name">{{ file.book.title }} - 제{{ file.volume_number }}권</p>
            </div>
            <div class="completion-next-prompt">
                <p id="next-volume-message">시리즈의 다음 권이 준비되어 있습니다. 지금 바로 이어서 읽으시겠습니까?</p>
            </div>
            <div class="completion-actions">
                <button id="go-to-next-action" class="completion-btn primary-btn">▶ 다음 권 이어서 읽기</button>
                <a href="{{ url_for('library.index') }}" class="completion-btn secondary-btn">서재로 돌아가기</a>
                <button class="completion-btn text-btn" onclick="document.getElementById('next-volume-popup').classList.add('hidden')">현재 페이지 머무르기</button>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/reader.js') }}"></script>
</body>
</html>
