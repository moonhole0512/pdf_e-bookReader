
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ file.book.title }} - Vol.{{ file.volume_number }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body data-file-id="{{ file.id }}" data-pdf-url="{{ pdf_url }}" data-initial-page="{{ state.current_page }}">

    <!-- ponytail: Native SVG Sharpen Filter (zero dependencies, 100% GPU accelerated) -->
    <svg style="position: absolute; width: 0; height: 0; pointer-events: none;" aria-hidden="true">
        <defs>
            <filter id="sharpen-filter-mild">
                <feConvolveMatrix order="3" preserveAlpha="true" kernelMatrix="0 -0.5 0 -0.5 3 -0.5 0 -0.5 0" />
            </filter>
            <filter id="sharpen-filter-strong">
                <feConvolveMatrix order="3" preserveAlpha="true" kernelMatrix="0 -1 0 -1 5 -1 0 -1 0" />
            </filter>
        </defs>
    </svg>

    <div id="reader-container">
        <div id="loader-overlay">
            <div class="loader"></div>
            <p>로딩 중...</p>
        </div>
        <div id="pdf-viewer"></div>

        <!-- Click & Tap Navigation Zones (Left 25%, Center 50%, Right 25%) -->
        <div id="reader-touch-zones">
            <div id="zone-prev" class="touch-zone touch-zone-left">
                <div class="zone-hint" aria-label="이전 페이지">
                    <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="15 18 9 12 15 6"></polyline>
                    </svg>
                </div>
            </div>
            <div id="zone-center" class="touch-zone touch-zone-center"></div>
            <div id="zone-next" class="touch-zone touch-zone-right">
                <div class="zone-hint" aria-label="다음 페이지">
                    <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="9 18 15 12 9 6"></polyline>
                    </svg>
                </div>
            </div>
        </div>
    </div>

    <!-- Bottom Timeline Scrubber -->
    <div id="reader-scrubber-container">
        <div id="scrubber-track">
            <div id="scrubber-progress"></div>
            <div id="scrubber-thumb"></div>
        </div>
        <div id="scrubber-tooltip" class="hidden"></div>
    </div>

    <div id="page-indicator" class="reader-info-pill">
        <span class="reader-book-title" title="{{ file.book.title }}">{{ file.book.title }}</span>
        {% if file.volume_number %}
        <span class="reader-vol-badge">제{{ file.volume_number }}권</span>
        {% endif %}
        <span class="reader-info-divider">·</span>
        <span class="reader-page-text"><span id="page-num"></span> / <span id="page-count"></span></span>
    </div>

    <!-- Apple-Style Glass Floating Controls (ponytail: Modern 4-action pill dock) -->
    <div id="floating-controls" class="reader-floating-dock" aria-label="뷰어 조작">
        <a href="{{ url_for('library.index') }}" id="list-btn" class="dock-btn" title="서재로 돌아가기 (Esc)">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M19 12H5M12 19l-7-7 7-7"/>
            </svg>
        </a>
        <div class="dock-divider"></div>
        <button id="zoom-out" class="dock-btn" title="축소 (-)">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
                <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
        </button>
        <button id="zoom-in" class="dock-btn" title="확대 (+)">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
        </button>
        <div class="dock-divider"></div>
        <button id="settings-btn" class="dock-btn" title="설정 (S)">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="3"></circle>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
            </svg>
        </button>
    </div>

    <!-- Settings Modal Overlay (ponytail: Centered glassmorphic modal with click-outside-to-close) -->
    <div id="settings-modal-overlay" class="modal-overlay hidden">
        <div id="settings-panel" class="settings-modal-card">
            <div class="settings-modal-header">
                <div class="settings-modal-title">
                    <span class="settings-title-icon">⚙️</span>
                    <h3>뷰어 설정</h3>
                </div>
                <button id="close-settings-btn" class="settings-close-btn" aria-label="닫기">&times;</button>
            </div>
            <div class="settings-panel-content">
                <div class="settings-section">
                    <h4>화면 맞춤</h4>
                    <div class="button-group">
                        <button id="fit-to-width">너비 맞춤</button>
                        <button id="fit-to-height">높이 맞춤</button>
                    </div>
                </div>
                <div class="settings-section">
                    <h4>페이지 레이아웃</h4>
                    <div class="button-group">
                        <button id="view-one-page">1P</button>
                        <button id="view-two-page-ltr">2P (좌→우)</button>
                        <button id="view-two-page-rtl">2P (우→좌)</button>
                    </div>
                </div>
                <!-- ponytail: Sharpen Filter Setting (Off / Mild / Strong) -->
                <div class="settings-section">
                    <h4>선명도 (샤픈)</h4>
                    <div class="button-group" id="sharpen-button-group">
                        <button id="sharpen-off" class="active">끄기</button>
                        <button id="sharpen-mild">보통</button>
                        <button id="sharpen-strong">강하게</button>
                    </div>
                </div>
                <div id="color-settings-section" class="settings-section">
                    <div class="section-title-wrapper">
                        <h4>화면 색조 및 보정</h4>
                        <button id="reset-color-settings">초기화</button>
                    </div>
                    <div class="setting-item">
                        <label for="brightness-slider">밝기</label>
                        <input type="range" id="brightness-slider" min="50" max="200" value="100">
                    </div>
                    <div class="setting-item">
                        <label for="contrast-slider">대비</label>
                        <input type="range" id="contrast-slider" min="50" max="200" value="100">
                    </div>
                    <div class="setting-item">
                        <label for="saturation-slider">채도</label>
                        <input type="range" id="saturation-slider" min="0" max="200" value="100">
                    </div>
                    <div class="setting-item toggle-item">
                        <label for="invert-colors-toggle">색상 반전</label>
                        <input type="checkbox" id="invert-colors-toggle">
                    </div>
                </div>
                <div class="settings-section">
                    <h4>표시</h4>
                    <div class="setting-item toggle-item">
                        <label for="toggle-page-indicator">페이지 번호 표시</label>
                        <input type="checkbox" id="toggle-page-indicator" checked>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="next-volume-popup" class="modal-overlay hidden">
        <div class="modal-content completion-sheet-content">
            <div class="completion-celebration">
                <div class="completion-trophy">🎉</div>
                <h2>완독을 축하합니다!</h2>
                <p class="completion-book-name">{{ file.book.title }} - 제{{ file.volume_number }}권</p>
            </div>
            <div class="completion-next-prompt">
                <p id="next-volume-message">시리즈의 다음 권이 준비되어 있습니다. 지금 바로 이어서 읽으시겠습니까?</p>
            </div>
            <div class="completion-actions">
                <button id="go-to-next-action" class="completion-btn primary-btn">▶ 다음 권 이어서 읽기</button>
                <a href="{{ url_for('library.index') }}" class="completion-btn secondary-btn">서재로 돌아가기</a>
                <button class="completion-btn text-btn" onclick="document.getElementById('next-volume-popup').classList.add('hidden')">현재 페이지 머무르기</button>
            </div>
        </div>
    </div>

    <!-- Transparent Backdrop to safely dismiss image menu without triggering page flips or menu toggle -->
    <div id="image-action-backdrop" class="image-action-backdrop hidden" aria-hidden="true"></div>

    <!-- Image Action Context Menu (Right-Click & Long-Press) -->
    <div id="image-action-menu" class="image-action-menu hidden" role="menu" aria-label="이미지 조작 메뉴">
        <div class="image-action-header">
            <span id="image-action-page-label">페이지 이미지</span>
        </div>
        <button id="img-action-copy" class="image-action-item" type="button">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
            이미지 복사
        </button>
        <button id="img-action-save" class="image-action-item" type="button">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="7 10 12 15 17 10"></polyline>
                <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
            이미지 저장
        </button>
        <button id="img-action-open" class="image-action-item" type="button">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
                <polyline points="15 3 21 3 21 9"></polyline>
                <line x1="10" y1="14" x2="21" y2="3"></line>
            </svg>
            새 탭에서 보기
        </button>
        <div class="image-action-divider"></div>
        <button id="img-action-replace" class="image-action-item" type="button">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2"/>
            </svg>
            이 페이지 이미지 교체
        </button>
        <button id="img-action-delete" class="image-action-item action-item-danger" type="button">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="3 6 5 6 21 6"></polyline>
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                <line x1="10" y1="11" x2="10" y2="17"></line>
                <line x1="14" y1="11" x2="14" y2="17"></line>
            </svg>
            이 페이지 삭제
        </button>
        <button id="img-action-cancel-edit" class="image-action-item hidden" type="button">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
                <path d="M3 3v5h5"/>
            </svg>
            편집 취소 (원상 복구)
        </button>
    </div>

    <!-- Hidden File Input for Page Replacement -->
    <input type="file" id="page-replace-file-input" accept="image/png, image/jpeg, image/webp" style="display: none;">

    <!-- Reader Toast Notification -->
    <div id="reader-toast" class="reader-toast hidden" role="status" aria-live="polite"></div>

    <script src="{{ url_for('static', filename='js/reader.js') }}"></script>
</body>
</html>
